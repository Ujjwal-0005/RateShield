version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: rateshield-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  mongodb:
    image: mongo:6.0
    container_name: rateshield-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  redis-data:
  mongo-data: